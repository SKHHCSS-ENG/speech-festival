name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main root
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          if gh api "repos/${REPO}/pages" > /tmp/pages.json 2>/tmp/pages.err; then
            echo "Pages already exists; setting source to main /"
            gh api --method PUT "repos/${REPO}/pages" --input - <<<"$payload"
          else
            echo "Pages site missing; creating from main /"
            cat /tmp/pages.err
            gh api --method POST "repos/${REPO}/pages" --input - <<<"$payload"
          fi
          gh api "repos/${REPO}/pages"
